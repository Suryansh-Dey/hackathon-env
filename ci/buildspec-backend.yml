# Backend CI (PLAN.md §21.3): fmt → clippy → unit/property/policy tests →
# integration tests (DynamoDB Local) → arm64 Lambda build.
# Runs on CodeBuild arm64 Amazon Linux 2023 images (privileged, for Docker).
version: 0.2

env:
  variables:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
    AI_MODE: mock
    KABADOS_ENV: ci
  exported-variables:
    - BUILD_SHA

phases:
  install:
    commands:
      - export BUILD_SHA="${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - |
        if ! command -v cargo >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component rustfmt,clippy
        fi
      - . "$HOME/.cargo/env"
      - pip3 install --quiet cargo-lambda
      - docker run -d --name ddb -p 8000:8000 amazon/dynamodb-local:latest -jar DynamoDBLocal.jar -inMemory -sharedDb
  pre_build:
    commands:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
  build:
    commands:
      - cargo test --workspace --locked
      - DYNAMODB_ENDPOINT=http://localhost:8000 cargo test --workspace --locked -- --ignored --test-threads=1
      - cargo lambda build --release --arm64 --locked --workspace --output-format zip --lambda-dir target/lambda
  post_build:
    commands:
      - ls -la target/lambda || true

artifacts:
  base-directory: target/lambda
  files:
    - "**/*"
  name: lambda-artifacts

cache:
  paths:
    - /root/.cargo/registry/**/*
    - /root/.cargo/git/**/*
    - target/**/*
