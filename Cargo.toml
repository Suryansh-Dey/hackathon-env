[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]
exclude = ["gemini-client-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# internal
kabados-domain = { path = "crates/domain" }
kabados-pricing = { path = "crates/pricing" }
kabados-copy = { path = "crates/copy" }
kabados-db = { path = "crates/db" }
kabados-authz = { path = "crates/authz" }
kabados-integrations = { path = "crates/integrations" }
kabados-agent = { path = "crates/agent" }
kabados-agents = { path = "crates/agents" }
kabados-api = { path = "crates/api" }
kabados-workers = { path = "crates/workers" }
kabados-client = { path = "crates/client" }
kabados-runtime = { path = "crates/runtime" }
# API reference checkout lives in gemini-client-api/llms-client/gemini (PLAN.md §11.2)
gemini-client-api = "7.5"

# core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1.18", features = ["v7", "serde"] }
chrono = { version = "0.4.41", default-features = false, features = ["serde", "clock", "std"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
h3o = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2"
regex = "1"
once_cell = "1"

# web / lambda
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
lambda_http = "1"
lambda_runtime = "1"
aws_lambda_events = { version = "1", default-features = false, features = ["dynamodb", "sqs", "eventbridge", "s3", "cognito"] }

# aws
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-sqs = "1"
aws-sdk-eventbridge = "1"
aws-sdk-sfn = "1"
aws-sdk-verifiedpermissions = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-geoplaces = "1"
aws-sdk-georoutes = "1"
aws-sdk-location = "1"
aws-sdk-rekognition = "1"
aws-sdk-textract = "1"
aws-sdk-chimesdkmeetings = "1"
aws-sdk-socialmessaging = "1"
aws-sdk-pinpointsmsvoicev2 = "1"
aws-sdk-sns = "1"
aws-sdk-sesv2 = "1"
aws-sdk-kms = "1"
aws-sdk-appconfigdata = "1"
aws-sdk-athena = "1"
aws-sigv4 = "1"
aws-credential-types = "1"
aws-smithy-runtime-api = "1"

# authz
cedar-policy = "4"

# cli
clap = { version = "4.5", features = ["derive"] }

# media
mime = "0.3"
image ={ version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
image_hasher = "3"

# testing
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
debug = false

[workspace.lints.clippy]
# Paise amounts are written with Indian (lakh/crore) digit grouping, e.g. 10_00_000_00.
inconsistent_digit_grouping = "allow"
